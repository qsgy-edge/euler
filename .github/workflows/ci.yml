name: Shared checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Use runner scratch storage for Windows fixtures
        if: runner.os == 'Windows'
        id: windows_temp
        shell: pwsh
        run: |
          "original=$env:TEMP" >> $env:GITHUB_OUTPUT
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Typecheck, build and full tests
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run check 2>&1 | tee artifacts/verification.log
      - name: Check Windows short-path boundaries on the original volume
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        env:
          TEMP: ${{ steps.windows_temp.outputs.original }}
          TMP: ${{ steps.windows_temp.outputs.original }}
        run: |
          node --test --test-concurrency=1 apps/cli/test/file-cli.test.ts apps/cli/test/file-tools.test.ts apps/cli/test/guidance.test.ts 2>&1 | Tee-Object -FilePath artifacts/verification-windows-system-temp.log
          exit $LASTEXITCODE
      - name: Record synthetic observations
        if: always()
        run: npm run evidence
      - name: Record scoped memory observations
        if: always()
        run: npm run evidence:memory
      - name: Record process and maintenance observations
        if: always()
        run: npm run evidence:maintenance
      - name: Record persistence transaction and recovery observations
        if: always()
        run: npm run evidence:persistence
      - name: Record controlled guidance observations
        if: always()
        run: npm run evidence:guidance
      - name: Record source recovery observations
        if: always()
        run: npm run evidence:source-recovery
      - name: Record owner memory fast lane observations
        if: always()
        run: npm run evidence:owner-memory
      - name: Record capture verification and analysis handoff observations
        if: always()
        run: npm run evidence:capture
      - name: Record memory promotion, comparison and feedback observations
        if: always()
        run: npm run evidence:memory-evolution
      - name: Record owner correction and recovery observations
        if: always()
        run: npm run evidence:memory-correction
      - name: Record forget suppression and independently approved restore observations
        if: always()
        run: npm run evidence:memory-forget
      - name: Record batch rollback and recovery observations
        if: always()
        run: npm run evidence:memory-rollback
      - name: Record context windows and controlled handoff observations
        if: always()
        run: npm run evidence:context
      - name: Record stable Historian compartment observations
        if: always()
        run: npm run evidence:historian
      - name: Record verified snapshot and recovery gap observations
        if: always()
        run: npm run evidence:backup
      - name: Record logical purge and continuation observations
        if: always()
        run: npm run evidence:purge
      - name: Record source archive cleanup and crash continuation observations
        if: always()
        run: npm run evidence:source-cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error
