name: Shared checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck, build and full tests
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run check 2>&1 | tee artifacts/verification.log
      - name: Record synthetic observations
        if: always()
        run: npm run evidence
      - name: Record scoped memory observations
        if: always()
        run: npm run evidence:memory
      - name: Record process and maintenance observations
        if: always()
        run: npm run evidence:maintenance
      - name: Record persistence transaction and recovery observations
        if: always()
        run: npm run evidence:persistence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error
